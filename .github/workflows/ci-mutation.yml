name: Mutation

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC. Non-blocking: this workflow is not in the
    # required-checks ruleset; a missed mutant is a review finding, not a
    # red X on someone's PR.
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  # cargo-mutants does not evaluate `cfg`, so a mutant in `#[cfg(windows)]`
  # code, or in a function that only forwards to it, survives every test on
  # Linux. Mutants whose name matches this pattern run on the Windows leg and
  # are left out of the Linux ones. A function like that joins the pattern.
  WINDOWS_ONLY: '\b(refuse_remote|remote)\b'

jobs:
  mutants:
    name: cargo-mutants (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-1
            os: ubuntu-24.04
            select: --exclude-re
            shard: 0/2
          - leg: linux-2
            os: ubuntu-24.04
            select: --exclude-re
            shard: 1/2
          - leg: windows
            os: windows-latest
            select: --re
            shard: 0/1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-24.04-${{ runner.arch }}-v1
      - name: Install cargo-mutants
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants,nextest
      - name: Run targeted mutation tests
        working-directory: src-tauri
        shell: pwsh
        env:
          SELECT: ${{ matrix.select }}
          SHARD: ${{ matrix.shard }}
        # Scope comes from src-tauri/.cargo/mutants.toml (grants + file/create
        # commands). In place, because the copy cargo-mutants otherwise tests
        # holds only src-tauri/ and cannot build: tauri.conf.json bundles
        # ../LICENSE. That rules out -j, hence the shards.
        #
        # Gate on the report, not the exit code: the clean baseline includes a
        # mutant killed by timeout (an infinite-loop mutation), which makes
        # cargo-mutants exit 3, and exit 3 also masks misses when both occur in
        # one run. Missed mutants fail the leg, keeping the documented baseline
        # non-decreasing (docs/engineering-invariants.md). So does a leg that
        # catches nothing: a pattern that matches no mutant exits 0.
        run: |
          cargo mutants --in-place --no-shuffle --test-tool=nextest $env:SELECT $env:WINDOWS_ONLY --shard $env:SHARD
          $ec = $LASTEXITCODE
          $missed = Get-Content mutants.out/missed.txt -ErrorAction Ignore
          if ($missed) {
            "Missed mutants:"
            $missed
            exit 2
          }
          if ($ec -ne 0 -and $ec -ne 3) {
            exit $ec
          }
          if (-not (Get-Content mutants.out/caught.txt -ErrorAction Ignore)) {
            "::error::No mutant was caught, so this leg tested nothing"
            exit 1
          }
          # Left to end by itself, the step takes cargo-mutants' exit code.
          exit 0
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mutants-report-${{ matrix.leg }}
          path: src-tauri/mutants.out/
          retention-days: 30
