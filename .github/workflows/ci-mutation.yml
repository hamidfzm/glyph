name: Mutation

# Throwaway diagnostic, never merged: why one test fails on the Windows leg.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONE: commands::file::tests::prune_export_dir_leaves_a_page_it_cannot_tell_from_the_one_just_written
  PROBE: commands::file::tests::diag_seal

jobs:
  diag:
    name: diag
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Build
        working-directory: src-tauri
        run: cargo test --lib --no-run
      - name: Env, pwsh
        run: |
          "pwsh TEMP=$env:TEMP TMP=$env:TMP"
      - name: Env, bash
        shell: bash
        run: |
          echo "bash TEMP=$TEMP TMP=$TMP"
          cmd //c "echo native TEMP=%TEMP% TMP=%TMP%"
      - name: Alone, cargo test, pwsh
        working-directory: src-tauri
        run: |
          foreach ($i in 1..3) {
            cargo test --lib -- --exact $env:ONE --nocapture
            "one exit=$LASTEXITCODE"
          }
          cargo test --lib -- --exact $env:PROBE --nocapture
          "probe exit=$LASTEXITCODE"
          exit 0
      - name: Alone, cargo test, bash
        shell: bash
        working-directory: src-tauri
        run: |
          for i in 1 2 3; do
            cargo test --lib -- --exact "$ONE" --nocapture && echo "one exit=0" || echo "one exit=$?"
          done
          cargo test --lib -- --exact "$PROBE" --nocapture && echo "probe exit=0" || echo "probe exit=$?"
      - name: nextest, pwsh
        working-directory: src-tauri
        run: |
          cargo nextest run --lib --no-fail-fast --failure-output final --success-output final prune_export_dir_leaves diag_seal
          "nextest exit=$LASTEXITCODE"
          cargo nextest run --lib --no-fail-fast prune_export_dir
          "nextest prune exit=$LASTEXITCODE"
          exit 0
      - name: nextest, bash
        shell: bash
        working-directory: src-tauri
        run: |
          cargo nextest run --lib --no-fail-fast --failure-output final --success-output final prune_export_dir_leaves diag_seal && echo "nextest exit=0" || echo "nextest exit=$?"
          cargo nextest run --lib --no-fail-fast prune_export_dir && echo "nextest prune exit=0" || echo "nextest prune exit=$?"
      - name: Whole lib, cargo test, bash
        shell: bash
        working-directory: src-tauri
        run: |
          cargo test --lib 2>&1 | tail -30 || true
