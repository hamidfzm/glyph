name: Mutation

# Throwaway diagnostic, never merged: token privileges per shell on Windows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Privileges, pwsh
        run: |
          & "$env:SystemRoot\System32\whoami.exe" /priv
      - name: Privileges, bash
        shell: bash
        run: |
          cmd //c "%SystemRoot%\System32\whoami.exe /priv"
