name: Build

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, ubuntu-22.04-arm, windows-latest]
        # Single-value dimension so `exclude` can key off the event:
        # ARM Linux only builds on pushes to main.
        is_pr:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          - platform: ubuntu-22.04-arm
            is_pr: true
        include:
          # PRs skip installer bundling and build single-arch macOS; pushes
          # to main build the full universal/bundled artifacts.
          - platform: macos-latest
            args_full: "--target universal-apple-darwin"
            args_pr: "--target aarch64-apple-darwin --no-bundle"
            targets_full: "aarch64-apple-darwin,x86_64-apple-darwin"
            targets_pr: "aarch64-apple-darwin"
          - platform: ubuntu-22.04
            # Bundle analysis is the codecov Vite plugin, which runs during
            # the frontend build; it does not need installer packaging.
            args_full: ""
            args_pr: "--no-bundle"
            bundle_analysis: true
          # No include entry for ubuntu-22.04-arm: include is processed
          # AFTER exclude, so an entry here would resurrect the excluded
          # PR leg as a new combination. Undefined args_full is ''.
          - platform: windows-latest
            args_full: ""
            args_pr: "--no-bundle"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-setup
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ github.event_name == 'pull_request' && matrix.targets_pr || matrix.targets_full }}
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-${{ matrix.platform }}-v1
          extra-packages: xdg-utils xvfb
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODECOV_TOKEN: ${{ matrix.bundle_analysis && secrets.CODECOV_TOKEN || '' }}
        with:
          args: ${{ github.event_name == 'pull_request' && matrix.args_pr || matrix.args_full }}
      # Records raw/gzip sizes for startup and major lazy chunks and fails on
      # budget regressions (bundle-budgets.json, docs/bundle-budgets.md). One
      # deterministic leg is enough: every platform ships the same frontend.
      - name: Check bundle budgets
        if: matrix.platform == 'ubuntu-22.04'
        run: node scripts/check-bundle-size.mjs
      # Boots the real webview under the production CSP and exercises the
      # grant-gated CLI export end to end; unit tests cannot enforce CSP.
      - name: Headless export smoke test
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 5
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          xvfb-run --auto-servernum ./src-tauri/target/release/glyph "$PWD/samples" --export site --out /tmp/csp-smoke
          test -f /tmp/csp-smoke/index.html
          test "$(find /tmp/csp-smoke -maxdepth 1 -name '*.html' | wc -l)" -ge 3
          # A document export renders the live DOM, so it exercises the
          # render-readiness gate the site export never touches.
          xvfb-run --auto-servernum ./src-tauri/target/release/glyph "$PWD/samples/Index.md" --export html --out /tmp/doc-smoke.html
          grep -q "<h1" /tmp/doc-smoke.html
          xvfb-run --auto-servernum ./src-tauri/target/release/glyph "$PWD/samples/Index.md" --export pdf --out /tmp/doc-smoke.pdf
          test "$(stat -c%s /tmp/doc-smoke.pdf)" -gt 5000
          # A wrong input kind is a usage error, not a silent empty export.
          if xvfb-run --auto-servernum ./src-tauri/target/release/glyph "$PWD/samples" --export pdf --out /tmp/nope.pdf; then
            echo "expected a usage error for a folder given to --export pdf" >&2
            exit 1
          fi
      # Drives the built binary over WebDriver (launch, render, edit, second
      # instance) against the same release build the export smoke used. A
      # release binary is required: the single-instance plugin is release-only.
      # Flags on PRs (per-PR gating is a #502 follow-up "once stable"); hard-
      # fails on pushes to main and on release, where a broken editor must stop.
      - name: Built-app smoke test
        id: app-smoke
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 10
        uses: ./.github/actions/app-smoke
      # continue-on-error keeps the required check green on PRs, which hides a
      # failure from the checks list; surface it as an annotation instead.
      - name: Flag built-app smoke failure
        if: matrix.platform == 'ubuntu-22.04' && steps.app-smoke.outcome == 'failure'
        run: echo "::warning title=Built-app smoke failed::pnpm test:app failed; it hard-fails on pushes to main and at release."

  build-android:
    name: Android
    # Runs on PRs too: this is the only job that compiles a `cfg(mobile)`
    # configuration. Every other gate builds the host target, where
    # `cfg(desktop)` is true, so mobile-only breakage is invisible to them.
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-setup
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-linux-android
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"
      - run: pnpm install --frozen-lockfile
      - name: Build Android APK (debug, aarch64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: pnpm tauri android build --debug --apk --target aarch64
      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: glyph-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14

  build-ios:
    name: iOS
    # Simulator only: unsigned, so it needs no Apple Developer account. Device
    # builds and IPAs require a paid signing identity and stay out of CI.
    # The shared `cfg(mobile)` code is already covered by the Android job; what
    # this catches is Xcode-project, Info.plist and Objective-C glue drift,
    # which nothing else compiles.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-setup
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - name: Build iOS app (debug, simulator)
        run: pnpm tauri ios build --debug --target aarch64-sim
