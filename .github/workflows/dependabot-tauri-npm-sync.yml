# Run from Actions → this workflow on the Dependabot `tauri` group branch.
# That group (see .github/dependabot.yml) already bumps the npm and Rust sides
# of Tauri in one PR, so the PR builds as opened. This workflow adds the two
# things Dependabot cannot produce:
#   1. `pnpm sync:tauri-npm` re-aligns @tauri-apps/plugin-* npm packages with
#      their matching Rust tauri-plugin-* crate versions, for a week where a
#      plugin's npm and crates.io releases were out of step. @tauri-apps/api
#      and @tauri-apps/cli are left to Dependabot: their patch numbers are
#      independent of the `tauri` crate (tauri 2.11.6 pairs with api 2.11.1),
#      so there is no crate version to pin them to.
#   2. `cargo check` invokes `tauri-build`, which regenerates the schemas under
#      `src-tauri/gen/schemas/` (acl-manifests, capabilities, desktop-schema,
#      macOS-schema). Only capabilities.json and desktop-schema.json are
#      tracked; they drift whenever any tauri/tauri-plugin-* version changes.
#
# Any changes from either step are committed and pushed back to the branch in a
# single commit so the PR is self-contained.
#
# Two jobs, so the bumped dependency tree never runs on a runner that holds a
# write token. `sync` runs it with a read-only token and no credential in
# .git/config: `pnpm install` executes every package's lifecycle scripts and
# `cargo check` every build.rs and proc-macro in the bumped Cargo.lock. All it
# hands over is a patch of the tracked files the sync may change, as an
# artifact. `push` starts on a fresh runner that never ran that code, applies
# the patch to the same commit, and pushes with the default `GITHUB_TOKEN`
# through the remote URL alone. Anything the bumped tree appended to
# $GITHUB_PATH (a fake `git`) or $GITHUB_ENV (a GIT_CONFIG_* override) stays
# in `sync`: those files only carry between steps of one job.
#
# The default `GITHUB_TOKEN` works here because workflow_dispatch runs in your
# repo context, unlike Dependabot-triggered workflows, which cannot access
# custom secrets or push reliably to Dependabot branches. A push made with
# that token does not start workflow runs, so CI stays on Dependabot's commit
# until someone updates the branch.
#
# Input: branch name (e.g. `dependabot/tauri-…`).

name: Sync Tauri artifacts on Dependabot branches

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update (e.g. dependabot/tauri-…)"
        required: true
        type: string

concurrency:
  group: tauri-sync-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      head: ${{ steps.diff.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.0" # src-tauri/rust-toolchain.toml

      - uses: ./.github/actions/pnpm-setup

      - name: Install Linux Tauri build deps
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-24.04-${{ runner.arch }}-v1

      - run: pnpm install --frozen-lockfile

      - name: Align @tauri-apps plugins with Cargo
        run: pnpm sync:tauri-npm

      - name: Regenerate Tauri ACL / capabilities schemas
        working-directory: src-tauri
        run: cargo check

      # Only the files the two steps above may touch; the other generated
      # schemas are gitignored, and intent-to-add keeps a new one in the diff.
      - name: Collect the changes as a patch
        id: diff
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add --intent-to-add src-tauri/gen/schemas/
          git diff --binary -- package.json pnpm-lock.yaml src-tauri/gen/schemas/ > "$RUNNER_TEMP/sync.patch"
          if [ -s "$RUNNER_TEMP/sync.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package.json pnpm-lock.yaml src-tauri/gen/schemas/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes from sync (already aligned)"
          fi

      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tauri-sync-patch
          path: ${{ runner.temp }}/sync.patch
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The exact commit `sync` diffed against, so the patch applies as made;
      # if the branch moved meanwhile, the push below is rejected as
      # non-fast-forward instead of overwriting anything.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.sync.outputs.head }}
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tauri-sync-patch
          path: ${{ runner.temp }}/sync

      # No pnpm or cargo here, so nothing from the bumped tree runs next to
      # the token. The patch was made on the runner that did run it, so only
      # the paths the sync may change are accepted. Hooks are off as well,
      # although a fresh checkout has none, so the commit depends on nothing.
      - name: Apply, commit, and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          HUSKY: 0
        run: |
          patch="$RUNNER_TEMP/sync/sync.patch"
          if git apply --numstat "$patch" | cut -f3 | grep -vE '^(package\.json|pnpm-lock\.yaml|src-tauri/gen/schemas/[^/]+)$'; then
            echo "::error::the patch touches files outside the sync's allowlist (listed above)"
            exit 1
          fi
          git apply --index "$patch"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c core.hooksPath=/dev/null \
              commit -m "chore(deps): align @tauri-apps plugins and regenerate schemas"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
