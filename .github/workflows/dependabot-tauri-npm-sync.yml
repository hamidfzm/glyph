# Run from Actions → this workflow on the Dependabot `tauri` group branch.
# That group (see .github/dependabot.yml) already bumps the npm and Rust sides
# of Tauri in one PR, so the PR builds as opened. This workflow adds the two
# things Dependabot cannot produce:
#   1. `pnpm sync:tauri-npm` re-aligns @tauri-apps/plugin-* npm packages with
#      their matching Rust tauri-plugin-* crate versions, for a week where a
#      plugin's npm and crates.io releases were out of step. @tauri-apps/api
#      and @tauri-apps/cli are left to Dependabot: their patch numbers are
#      independent of the `tauri` crate (tauri 2.11.6 pairs with api 2.11.1),
#      so there is no crate version to pin them to.
#   2. `cargo check` invokes `tauri-build`, which regenerates the schemas under
#      `src-tauri/gen/schemas/` (acl-manifests, capabilities, desktop-schema,
#      macOS-schema). Only capabilities.json and desktop-schema.json are
#      tracked; they drift whenever any tauri/tauri-plugin-* version changes.
#
# Any changes from either step are committed and pushed back to the branch in a
# single commit so the PR is self-contained.
#
# Uses the default `GITHUB_TOKEN` (workflow_dispatch runs in your repo context,
# unlike Dependabot-triggered workflows, which cannot access custom secrets or
# push reliably to Dependabot branches). A push made with that token does not
# start workflow runs, so CI stays on Dependabot's commit until someone
# updates the branch.
#
# Input: branch name (e.g. `dependabot/tauri-…`).

name: Sync Tauri artifacts on Dependabot branches

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update (e.g. dependabot/tauri-…)"
        required: true
        type: string

concurrency:
  group: tauri-sync-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: ./.github/actions/pnpm-setup

      - name: Install Linux Tauri build deps
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-latest-${{ runner.arch }}-v1

      - run: pnpm install --frozen-lockfile

      - name: Align @tauri-apps plugins with Cargo
        run: pnpm sync:tauri-npm

      - name: Regenerate Tauri ACL / capabilities schemas
        working-directory: src-tauri
        run: cargo check

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src-tauri/gen/schemas/
          if git diff --cached --quiet; then
            echo "No changes from sync (already aligned)"
            exit 0
          fi
          git commit -m "chore(deps): align @tauri-apps plugins and regenerate schemas"
          git push
