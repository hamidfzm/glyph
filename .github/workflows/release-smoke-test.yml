name: Release Smoke Test
# run-name is evaluated at queue time, before any job runs, and a run
# cannot be renamed afterwards. So a run without a version only resolves
# the latest release and re-dispatches this workflow with the version
# filled in; that second run does the actual testing and carries the
# version in its title.
run-name: Release Smoke Test ${{ inputs.version && format('v{0}', inputs.version) || '(dispatching latest)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to test, e.g. 0.17.0 (defaults to the latest release)"
        required: false
        type: string
  schedule:
    # Daily; the resolve job only dispatches the testing run when the
    # latest release is 2-3 days old, so each release gets exactly one
    # automatic check.
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed to re-dispatch this workflow with the resolved version.
      actions: write
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      mature: ${{ steps.resolve.outputs.mature }}
    steps:
      - name: Resolve target release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Accept a bare version (0.17.0) or a tag (v0.17.0): strip any
          # leading v, then prepend it, so both forms resolve to the tag.
          TAG="${INPUT_VERSION:+v${INPUT_VERSION#v}}"
          TAG="${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          PUBLISHED=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)

          AGE=$(( $(date +%s) - $(date -d "$PUBLISHED" +%s) ))

          # Two days is long enough for every channel we publish to ourselves to
          # have built and indexed, so a channel still serving an older version
          # by then is broken, not slow. Below that, pending stays informational.
          MATURE=false
          [ "$AGE" -ge 172800 ] && MATURE=true

          RUN=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$AGE" -lt 172800 ] || [ "$AGE" -ge 259200 ]; then
              RUN=false
              echo "::notice::Skipping: latest release $TAG is outside the 2-3 day window"
            fi
          fi

          # No version input means this run was only asked to resolve the
          # latest release: re-dispatch with the version filled in so the
          # testing run carries it in its title, and do nothing here. The
          # dispatched run has the input set, so it cannot recurse.
          if [ -z "$INPUT_VERSION" ] && [ "$RUN" = true ]; then
            gh workflow run release-smoke-test.yml --repo "$GITHUB_REPOSITORY" -f version="${TAG#v}"
            RUN=false
            echo "::notice::Dispatched Release Smoke Test $TAG"
            echo "Dispatched a titled run for **$TAG**." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "run=$RUN"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "mature=$MATURE"
          } >> "$GITHUB_OUTPUT"

  homebrew-cask:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from Homebrew cask and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # The runner image ships aws/tap, which we never use; leaving it
          # tapped makes every brew command warn that it is untrusted.
          brew untap aws/tap || true
          brew tap glyph-md/tap
          brew trust glyph-md/tap || true

          AVAILABLE=$(brew info --cask --json=v2 glyph-md/tap/glyph | jq -r '.casks[0].version')
          if [ "$AVAILABLE" != "$VERSION" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "Cask serves $AVAILABLE, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          brew install --cask glyph-md/tap/glyph
          INSTALLED=$(defaults read /Applications/Glyph.app/Contents/Info CFBundleShortVersionString)
          [ "$INSTALLED" = "$VERSION" ]

          BIN=/Applications/Glyph.app/Contents/MacOS/glyph
          [ -x "$BIN" ] || BIN=/Applications/Glyph.app/Contents/MacOS/Glyph
          [ "$("$BIN" --version)" = "glyph $VERSION" ]
          echo "status=verified" >> "$GITHUB_OUTPUT"

  homebrew-formula:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from Homebrew formula and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          # The formula ships no bottle, so it stages through Mktemp, which
          # chowns the staging dir to brew's group. On the runner that group is
          # "docker", a supplementary group of "runner"; Homebrew's Linux bwrap
          # sandbox maps only the primary gid, so the chown fails with EINVAL
          # (not the EPERM Mktemp rescues) and the install dies. This is the
          # documented opt-out and only turns off build-time isolation.
          HOMEBREW_NO_SANDBOX_LINUX: 1
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap glyph-md/tap

          # The tap ships both a formula and a cask named glyph; without
          # --formula brew warns about the ambiguity on every invocation.
          AVAILABLE=$(brew info --formula --json=v2 glyph-md/tap/glyph | jq -r '.formulae[0].versions.stable')
          if [ "$AVAILABLE" != "$VERSION" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "Formula serves $AVAILABLE, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          brew install --formula glyph-md/tap/glyph
          sudo apt-get update && sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0
          [ "$("$(brew --prefix)/bin/glyph" --version)" = "glyph $VERSION" ]

          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 "$(brew --prefix)/bin/glyph"
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  apt:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from apt repo and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://glyph-md.github.io/apt-repo/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/glyph.gpg
          echo "deb [signed-by=/usr/share/keyrings/glyph.gpg] https://glyph-md.github.io/apt-repo stable main" | sudo tee /etc/apt/sources.list.d/glyph.list
          sudo apt-get update

          CANDIDATE=$(apt-cache policy glyph | awk '/Candidate:/ {print $2}')
          if [ "$CANDIDATE" != "$VERSION" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "apt repo serves $CANDIDATE, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo apt-get install -y glyph xvfb
          INSTALLED=$(dpkg-query -W -f='${Version}' glyph)
          [ "$INSTALLED" = "$VERSION" ]
          [ "$(glyph --version)" = "glyph $VERSION" ]

          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 glyph
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  # Separate jobs per series: matrix jobs share one outputs map (last leg
  # wins), which would let a pending leg report the other leg's status.
  ppa-jammy:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from PPA and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SERIES: jammy
        run: |
          sudo add-apt-repository -y ppa:hamidfzm/glyph
          sudo apt-get update

          CANDIDATE=$(apt-cache policy glyph | awk '/Candidate:/ {print $2}')
          case "$CANDIDATE" in
            "$VERSION"-*) ;;
            *)
              echo "status=pending" >> "$GITHUB_OUTPUT"
              echo "PPA ($SERIES) serves $CANDIDATE, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          sudo apt-get install -y glyph xvfb
          INSTALLED=$(dpkg-query -W -f='${Version}' glyph)
          case "$INSTALLED" in "$VERSION"-*) ;; *) echo "installed $INSTALLED"; exit 1 ;; esac
          # Catches a package that installs cleanly but ships no binary.
          [ "$(glyph --version)" = "glyph $VERSION" ]

          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 glyph
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  ppa-noble:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from PPA and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SERIES: noble
        run: |
          sudo add-apt-repository -y ppa:hamidfzm/glyph
          sudo apt-get update

          CANDIDATE=$(apt-cache policy glyph | awk '/Candidate:/ {print $2}')
          case "$CANDIDATE" in
            "$VERSION"-*) ;;
            *)
              echo "status=pending" >> "$GITHUB_OUTPUT"
              echo "PPA ($SERIES) serves $CANDIDATE, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          sudo apt-get install -y glyph xvfb
          INSTALLED=$(dpkg-query -W -f='${Version}' glyph)
          case "$INSTALLED" in "$VERSION"-*) ;; *) echo "installed $INSTALLED"; exit 1 ;; esac
          # Catches a package that installs cleanly but ships no binary.
          [ "$(glyph --version)" = "glyph $VERSION" ]

          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 glyph
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  snap:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from Snap Store and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          AVAILABLE=$(snap info glyph | awk '$1 == "latest/stable:" {print $2}')
          if [ "$AVAILABLE" != "$VERSION" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "Snap stable serves ${AVAILABLE:-nothing}, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo snap install glyph
          INSTALLED=$(snap list glyph | awk 'NR==2 {print $2}')
          [ "$INSTALLED" = "$VERSION" ]
          [ "$(snap run glyph --version)" = "glyph $VERSION" ]
          sudo apt-get update && sudo apt-get install -y xvfb

          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 snap run glyph
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  dnf:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from dnf repo and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://glyph-md.github.io/rpm-repo/glyph.repo -o /etc/yum.repos.d/glyph.repo

          # repo_gpgcheck=1 makes the first read of the repo prompt to import
          # the signing key. Without --assumeyes dnf answers N and every query
          # comes back empty, which reads as "never published".
          dnf -y -q makecache --repo=glyph >/dev/null

          # The repo keeps every release, and repoquery lists them oldest
          # first, so --latest-limit is what picks the current one.
          read -r NAME AVAILABLE <<< "$(dnf -q repoquery --latest-limit 1 --queryformat '%{name} %{version}\n' glyph Glyph 2>/dev/null | head -1)"
          if [ "$AVAILABLE" != "$VERSION" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "dnf repo serves ${AVAILABLE:-nothing}, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          dnf install -y "$NAME" xorg-x11-server-Xvfb
          INSTALLED=$(rpm -q --qf '%{VERSION}' "$NAME")
          [ "$INSTALLED" = "$VERSION" ]
          [ "$(glyph --version)" = "glyph $VERSION" ]

          Xvfb :99 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          [ -S /tmp/.X11-unix/X99 ] || { echo "Xvfb failed to start"; exit 1; }
          set +e
          DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 timeout 15 glyph
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  aur:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Build from AUR and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo jq xorg-server-xvfb

          AVAILABLE=$(curl -s 'https://aur.archlinux.org/rpc/?v=5&type=info&arg[]=glyph-md-bin' | jq -r '.results[0].Version // empty')
          if [ "${AVAILABLE%%-*}" != "$VERSION" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "AUR serves ${AVAILABLE:-nothing}, not $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          sudo -u builder git clone https://aur.archlinux.org/glyph-md-bin.git /home/builder/pkg
          cd /home/builder/pkg
          sudo -u builder makepkg -si --noconfirm

          INSTALLED=$(pacman -Q glyph-md-bin | awk '{print $2}')
          [ "${INSTALLED%%-*}" = "$VERSION" ]
          [ "$(glyph --version)" = "glyph $VERSION" ]

          Xvfb :99 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          [ -S /tmp/.X11-unix/X99 ] || { echo "Xvfb failed to start"; exit 1; }
          set +e
          DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 timeout 15 glyph
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }
          echo "status=verified" >> "$GITHUB_OUTPUT"

  scoop:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from Scoop and verify
        id: check
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $manifest = Invoke-RestMethod https://raw.githubusercontent.com/glyph-md/scoop-bucket/main/bucket/glyph.json
          if ($manifest.version -ne $env:VERSION) {
            "status=pending" | Out-File -Append $env:GITHUB_OUTPUT
            "Scoop bucket serves $($manifest.version), not $env:VERSION yet." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          Invoke-RestMethod get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"

          scoop bucket add glyph-md https://github.com/glyph-md/scoop-bucket
          scoop install glyph
          $installed = (scoop list glyph 6>$null | Where-Object Name -eq glyph).Version
          if ($installed -ne $env:VERSION) { Write-Error "installed $installed"; exit 1 }
          if (-not (Get-Command glyph -ErrorAction SilentlyContinue)) { Write-Error "no glyph shim"; exit 1 }
          "status=verified" | Out-File -Append $env:GITHUB_OUTPUT

  chocolatey:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from Chocolatey and verify
        id: check
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # choco search only lists approved versions, so moderation shows as pending.
          $available = ((choco search glyph --exact --limit-output | Select-Object -First 1) -split '\|')[-1]
          if ($available -ne $env:VERSION) {
            "status=pending" | Out-File -Append $env:GITHUB_OUTPUT
            "Chocolatey serves $available, not $env:VERSION yet (moderation queue)." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          choco install glyph --version $env:VERSION -y
          $installed = ((choco list glyph --limit-output | Select-Object -First 1) -split '\|')[-1]
          if ($installed -ne $env:VERSION) { Write-Error "installed $installed"; exit 1 }
          if (-not (Test-Path "$env:ProgramFiles\Glyph\Glyph.exe")) { Write-Error "Glyph.exe not found"; exit 1 }
          "status=verified" | Out-File -Append $env:GITHUB_OUTPUT

  winget:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Install from winget and verify
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/h/hamidfzm/Glyph >/dev/null 2>&1; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "hamidfzm.Glyph not yet in winget-pkgs (bootstrap pending)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! winget show hamidfzm.Glyph --versions --accept-source-agreements --disable-interactivity | grep -qx "$VERSION"; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "winget does not serve $VERSION yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          winget install hamidfzm.Glyph --version "$VERSION" --silent \
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          test -x "$PROGRAMFILES/Glyph/Glyph.exe"
          echo "status=verified" >> "$GITHUB_OUTPUT"

  # Direct-download artifacts. Unlike the package channels these are served by
  # the release itself, so there is nothing to wait for: the artifact is there
  # and works, or the release is broken. They never report pending.
  dmg:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Mount the DMG and verify
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="Glyph_${VERSION}_universal.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DMG"

          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT

          APP="$MOUNT/Glyph.app"
          [ "$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)" = "$VERSION" ]

          BIN="$APP/Contents/MacOS/glyph"
          [ -x "$BIN" ] || BIN="$APP/Contents/MacOS/Glyph"
          [ "$("$BIN" --version)" = "glyph $VERSION" ]

  appimage:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract the AppImage and verify
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APPIMAGE="Glyph_${VERSION}_amd64.AppImage"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APPIMAGE"
          chmod +x "$APPIMAGE"

          # Runners have no FUSE, so extract rather than mount.
          "./$APPIMAGE" --appimage-extract >/dev/null
          sudo apt-get update && sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0
          [ "$(squashfs-root/AppRun --version)" = "glyph $VERSION" ]

          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a timeout 15 squashfs-root/AppRun
          CODE=$?
          set -e
          [ "$CODE" -eq 124 ] || { echo "launch check failed (exit $CODE)"; exit 1; }

  # The MSI is what Chocolatey, Scoop, and winget repackage, so it is covered
  # by those jobs; the NSIS setup.exe is only ever installed directly.
  nsis:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Silent-install the NSIS setup and verify
        shell: pwsh
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "Glyph_$($env:VERSION)_x64-setup.exe"
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $setup

          $proc = Start-Process -FilePath ".\$setup" -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Write-Error "installer exited $($proc.ExitCode)"; exit 1 }

          # Tauri's NSIS installer defaults to a per-user install under
          # $LOCALAPPDATA\<productName>; a per-machine build lands under
          # Program Files instead. The payload binary is the Cargo package
          # name, glyph.exe, not the product name.
          $exe = "$env:LOCALAPPDATA\Glyph\glyph.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\Glyph\glyph.exe" }
          if (-not (Test-Path $exe)) { Write-Error "glyph.exe not found after install"; exit 1 }

          # glyph.exe is a GUI subsystem binary with no console to print to, so
          # the embedded file version is the assertion available here.
          $installed = (Get-Item $exe).VersionInfo.FileVersion
          if ($installed -notlike "$($env:VERSION)*") { Write-Error "installed $installed"; exit 1 }

  summary:
    needs:
      - resolve
      - homebrew-cask
      - homebrew-formula
      - apt
      - ppa-jammy
      - ppa-noble
      - snap
      - dnf
      - aur
      - scoop
      - chocolatey
      - winget
      - dmg
      - appimage
      - nsis
    if: ${{ !cancelled() && needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build channel summary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          MATURE: ${{ needs.resolve.outputs.mature }}
          # Field 2 is the publishing model: "direct" channels are pushed by our
          # own release workflow, so once the release has matured a pending one
          # means publishing broke. "queued" channels wait on third-party review
          # (Chocolatey moderation, winget-pkgs PRs) and stay informational.
          ROWS: |
            homebrew-cask direct ${{ needs.homebrew-cask.result }} ${{ needs.homebrew-cask.outputs.status }}
            homebrew-formula direct ${{ needs.homebrew-formula.result }} ${{ needs.homebrew-formula.outputs.status }}
            apt direct ${{ needs.apt.result }} ${{ needs.apt.outputs.status }}
            ppa-jammy direct ${{ needs.ppa-jammy.result }} ${{ needs.ppa-jammy.outputs.status }}
            ppa-noble direct ${{ needs.ppa-noble.result }} ${{ needs.ppa-noble.outputs.status }}
            snap direct ${{ needs.snap.result }} ${{ needs.snap.outputs.status }}
            dnf direct ${{ needs.dnf.result }} ${{ needs.dnf.outputs.status }}
            aur direct ${{ needs.aur.result }} ${{ needs.aur.outputs.status }}
            scoop direct ${{ needs.scoop.result }} ${{ needs.scoop.outputs.status }}
            chocolatey queued ${{ needs.chocolatey.result }} ${{ needs.chocolatey.outputs.status }}
            winget queued ${{ needs.winget.result }} ${{ needs.winget.outputs.status }}
            dmg direct ${{ needs.dmg.result }}
            appimage direct ${{ needs.appimage.result }}
            nsis direct ${{ needs.nsis.result }}
        run: |
          {
            echo "## Release Smoke Test: $TAG"
            echo ""
            echo "| Channel | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          while read -r CHANNEL MODEL RESULT STATUS; do
            [ -z "$CHANNEL" ] && continue
            if [ "$STATUS" = "pending" ] && [ "$MODEL" = "direct" ] && [ "$MATURE" = "true" ]; then
              ROW="pending (never published)"
              FAILED=1
            elif [ "$RESULT" = "success" ] && [ -n "$STATUS" ]; then
              ROW="$STATUS"
            elif [ "$RESULT" = "success" ]; then
              ROW="verified"
            else
              ROW="failed ($RESULT)"
              FAILED=1
            fi
            echo "| $CHANNEL | $ROW |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$ROWS"

          exit "$FAILED"
