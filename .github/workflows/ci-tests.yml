name: Tests

on:
  workflow_call:

jobs:
  test-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
      - name: Upload frontend coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true
      - name: Upload frontend test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: junit-frontend.xml
          flags: frontend
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true

  test-rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
      - name: Install Linux dependencies
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-latest-${{ runner.arch }}-v1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: nextest
      - name: Run Rust tests with coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --workspace --lcov --output-path ../coverage-rust.lcov --profile ci
      - name: Upload Rust coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage-rust.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true
      - name: Upload Rust test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: src-tauri/target/nextest/ci/junit.xml
          flags: rust
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true

  # Windows-gated guards (the junction escape test in grants.rs) never compile
  # on the ubuntu coverage job above; this keeps them exercised in CI. The
  # preview handler is Windows-only in full: its COM and WebView2 code compiles
  # nowhere else, so this is the only job that type-checks or lints it. Not in
  # the required-checks ruleset.
  test-rust-windows:
    name: Rust Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --workspace --lib
      - name: Run Clippy on the Windows-only code
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Checks the host's plugin API against glyph-md/plugin-template's declared
  # types and built plugin, and the marketplace schema and index in
  # glyph-md/plugins. An app PR that changes the API goes red here until the
  # matching template/plugins change lands on their main. Not in the
  # required-checks ruleset.
  plugin-contract:
    name: Plugin contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: glyph-md/plugin-template
          path: .ecosystem/plugin-template
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: glyph-md/plugins
          path: .ecosystem/plugins
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm install --frozen-lockfile
      # The template has no lockfile, so its install runs no lifecycle scripts.
      - name: Typecheck and build the plugin template
        working-directory: .ecosystem/plugin-template
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck && npm run build
      - name: Add TypeScript problem matcher
        run: echo "::add-matcher::.github/matchers/tsc.json"
      - name: Compare the template's API types with the host's
        run: pnpm exec tsc -p scripts/plugin-contract
      - name: Load the template and read the marketplace index
        env:
          GLYPH_PLUGIN_CONTRACT: "1"
        run: pnpm exec vitest run src/lib/plugins/ecosystemContract.test.ts

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - name: Install Linux dependencies
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-latest-${{ runner.arch }}-v1
      - name: Add Clippy problem matcher
        run: echo "::add-matcher::.github/matchers/rust.json"
      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
