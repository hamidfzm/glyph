name: Tests

on:
  workflow_call:

jobs:
  test-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
      - name: Upload frontend coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true
      - name: Upload frontend test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: junit-frontend.xml
          flags: frontend
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true

  test-rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
      - name: Install Linux dependencies
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-latest-${{ runner.arch }}-v1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: nextest
      - name: Run Rust tests with coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --lcov --output-path ../coverage-rust.lcov --profile ci
      - name: Upload Rust coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage-rust.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true
      - name: Upload Rust test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: src-tauri/target/nextest/ci/junit.xml
          flags: rust
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # PyPI uploader: the GPG-verified binary intermittently fails.
          use_pypi: true

  # Windows-gated guards (the junction escape test in grants.rs) never compile
  # on the ubuntu coverage job above; this keeps them exercised in CI. Not in
  # the required-checks ruleset.
  test-rust-windows:
    name: Rust Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - name: Install Linux dependencies
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps
        with:
          cache-key: apt-webkit-ubuntu-latest-${{ runner.arch }}-v1
      - name: Add Clippy problem matcher
        run: echo "::add-matcher::.github/matchers/rust.json"
      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
