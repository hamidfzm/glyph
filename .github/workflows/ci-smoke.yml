name: Smoke

on:
  workflow_call:

# CI-time smoke tests: fast checks that drive real engines or binaries, as
# opposed to unit tests. The built-app tauri-driver smoke (#502) instead rides
# the Build workflow's ubuntu-22.04 leg (.github/actions/app-smoke), reusing
# the release binary already built there rather than building a second one.
# Post-release channel smoke tests live in release-smoke-test.yml instead.
jobs:
  webkit:
    # Renders a real D2 diagram and probes every CSP-dependent render surface
    # in Playwright WebKit under the CSP shipped in tauri.conf.json. WebKit
    # enforces the page CSP inside blob workers (Chromium does not), so only
    # a WebKit run catches a CSP that breaks rendering on Linux/macOS. It also
    # opens hostile shared documents in the built web viewer, whose meta CSP
    # is the only network control a browser gives it.
    name: WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit
      - run: pnpm build:web
      - run: pnpm test:e2e

  release-bump:
    # Runs the release scripts against throwaway repos: the version bump
    # (format validation, tag-exists check, and package.json / Cargo.toml /
    # Cargo.lock agreement) and the changelog resolution (previous tag from the
    # tag's own ancestry, commit fallback when generate-notes finds no pull
    # requests). Guards create-release.yml and release.yml without cutting a
    # release (see #504). On a pull request it also runs the commit-msg and
    # pre-push hooks' check over the PR's commits and text, which catches
    # commits made where those hooks never ran.
    name: Release bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Every commit, but no file contents beyond the checkout: the
          # commit check walks the PR's commits back to its base branch.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/rust-setup
      - run: bash scripts/bump-version.test.sh
      - run: bash scripts/release-changelog.test.sh
      - run: bash scripts/check-ai-attribution.test.sh
      # The title and body are read live, not from the event payload: a
      # re-run replays the payload the run started with, so a description
      # fixed afterwards would fail the same way until the next push.
      - name: Check the PR's commits, title and description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          sh scripts/check-ai-attribution.sh commits "$HEAD_SHA" --not "origin/$BASE_REF"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '.title + "\n\n" + (.body // "") + "\n"' > "$RUNNER_TEMP/pr.md"
          sh scripts/check-ai-attribution.sh text "$RUNNER_TEMP/pr.md"
