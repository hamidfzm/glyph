name: Security

on:
  # Push: only `main` so the weekly run is the source of truth for
  # feature-branch security findings. Direct pushes to feature branches
  # are still covered by their PR run.
  push:
    branches: [main]
  # PR: any target branch (PRs to `feature/*` get the same scan as PRs
  # to `main`).
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    # Only this job uploads SARIF; the audit jobs stay read-only.
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.0" # src-tauri/rust-toolchain.toml
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm install --frozen-lockfile
      # The whole tree, not `--prod`: the devDependencies (vite and its Sentry
      # and Codecov plugins, @tauri-apps/cli) run at release time with the
      # publishing secrets. A registry failure (pnpm retries connection
      # errors itself, not a bad response from the bulk advisory endpoint,
      # https://github.com/pnpm/pnpm/issues/11265) is retried here, then
      # fails the job instead of passing as a clean audit.
      - name: pnpm audit
        run: |
          report="$RUNNER_TEMP/audit.json"
          for attempt in 1 2 3; do
            if pnpm audit --json > "$report"; then
              echo "No known vulnerabilities found"
              exit 0
            fi
            # A report means findings: show them readably and fail.
            if jq -e .metadata "$report" > /dev/null 2>&1; then
              pnpm audit
              exit 1
            fi
            echo "pnpm audit returned no report (attempt $attempt of 3)"
            cat "$report"
            sleep 15
          done
          exit 1
