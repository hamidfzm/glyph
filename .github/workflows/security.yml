name: Security

on:
  # Push: only `main` so the weekly run is the source of truth for
  # feature-branch security findings. Direct pushes to feature branches
  # are still covered by their PR run.
  push:
    branches: [main]
  # PR: any target branch (PRs to `feature/*` get the same scan as PRs
  # to `main`).
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Only this job uploads SARIF; the audit jobs stay read-only.
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm install --frozen-lockfile
      # TODO: Revert to `pnpm audit --prod` when pnpm fixes bulk endpoint support
      # Workaround: https://github.com/pnpm/pnpm/issues/11265
      - run: pnpm audit --prod --ignore-registry-errors
