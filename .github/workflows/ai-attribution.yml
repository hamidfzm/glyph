name: AI attribution

# Runs scripts/check-ai-attribution.sh, the same check as the commit-msg and
# pre-push hooks, over a PR's commits and its description. Commits made where
# those hooks never ran (a cloud session, --no-verify, the web editor) still
# cannot bring an agent identity or co-author trailer into the squash merge,
# which would copy it onto main.
#
# Its own workflow, not a CI job, so that editing the description re-runs
# only this check.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-ai-attribution.test.sh
      - name: Check the PR's commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: sh scripts/check-ai-attribution.sh commits "$HEAD_SHA" --not "origin/$BASE_REF"
      - name: Check the PR's title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.md"
          sh scripts/check-ai-attribution.sh text "$RUNNER_TEMP/pr.md"
