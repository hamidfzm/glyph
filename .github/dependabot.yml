version: 2

# `tauri build` refuses to run when an npm package and its Rust crate differ in
# major.minor ("Found version mismatched Tauri packages"), so both sides of a
# Tauri bump must land together. This cross-ecosystem group opens one PR
# (branch `dependabot/tauri-…`) from the two entries tagged with it below; the
# regular npm and cargo entries ignore the same names so nothing is bumped twice.
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: "weekly"
    # Settable only here, not on a member entry. Group PRs get no prefix by
    # default, and the CI title check rejects a title without one.
    commit-message:
      prefix: "chore(deps)"

updates:
  # Members of the `tauri` group: `patterns` (required) selects what each
  # contributes, and the schedule comes from the group.
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "tauri"
    patterns:
      - "@tauri-apps/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    multi-ecosystem-group: "tauri"
    patterns:
      - "tauri"
      - "tauri-build"
      - "tauri-plugin-*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Owned by the `tauri` group above.
      - dependency-name: "@tauri-apps/*"
    groups:
      dev-dependencies:
        # Catches Biome, vitest, TypeScript, Tailwind, husky, lint-staged,
        # and the rest of the tooling. Anything devDependencies sits here.
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Owned by the `tauri` group above; keep in step with its cargo patterns.
      - dependency-name: "tauri"
      - dependency-name: "tauri-build"
      - dependency-name: "tauri-plugin-*"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Every `uses:` is pinned to a commit SHA (see CONTRIBUTING.md); Dependabot
  # rewrites the SHA and the `# vX.Y.Z` comment together. "/" only covers
  # .github/workflows, so the composite actions need their own entries.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # init/autobuild/analyze are separate Dependabot dependencies but must run
      # the same version; a lone bump fails with "Loaded a configuration file for
      # version 'X', but running version 'Y'". Group them into one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
