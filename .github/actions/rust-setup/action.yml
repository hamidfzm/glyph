name: Set up Rust
description: Install the pinned Rust toolchain and restore the src-tauri cargo cache
inputs:
  targets:
    description: Comma-separated extra compilation targets
    default: ""
  components:
    description: Comma-separated extra toolchain components
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: "1.97.0" # src-tauri/rust-toolchain.toml
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri
