<!doctype html>
<html lang="en" data-platform="windows">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No network: this page's own files, plus images from the previewed
         file's folder, which the preview handler maps read-only to
         glyph-document.example (src-tauri/crates/preview-handler/src/hosts.rs). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://glyph-document.example; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Glyph preview</title>
  </head>
  <body>
    <main id="preview"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
